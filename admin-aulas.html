<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khalid — Gerenciador de Aulas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:#101828;color:white;padding:20px}.wrap{max-width:1200px;margin:auto;padding:22px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0001;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.lesson{padding:16px;border:1px solid #e4e7ec;border-radius:12px}.num{font-size:24px;font-weight:800}.muted{color:#667085}button{padding:10px 14px;border:0;border-radius:9px;background:#155eef;color:#fff;cursor:pointer}button.alt{background:#475467}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #d0d5dd;border-radius:9px}.modal{position:fixed;inset:0;background:#0008;display:none;padding:20px;overflow:auto}.modal .box{max-width:800px;margin:30px auto;background:#fff;padding:24px;border-radius:16px}.status{font-weight:700}</style></head><body><header class="top"><strong>🌐 SITE KHALID</strong><div>👑 Gerenciador de Aulas</div></header><main class="wrap"><div id="gate" class="card">Verificando acesso...</div><section id="app" style="display:none"><div class="card"><h1>🎓 Porteiro Profissional & Controlador de Acesso</h1><p class="muted">16 aulas online · conteúdo · vídeo · quiz · progresso</p><div id="summary"></div></div><div id="lessons" class="grid"></div></section></main><div id="modal" class="modal"><div class="box"><h2 id="mTitle"></h2><label>Título</label><input id="title"><label>Objetivos</label><textarea id="objectives" rows="4"></textarea><label>Conteúdo da aula (texto)</label><textarea id="content" rows="12"></textarea><label>URL da videoaula</label><input id="video"><label>Duração (minutos)</label><input id="duration" type="number"><label><input id="published" type="checkbox" style="width:auto"> Publicada</label><br><button id="save">Salvar alterações</button> <button class="alt" onclick="closeModal()">Cancelar</button><p id="saveMsg"></p></div></div><script>const db=window.supabase.createClient('https://xraqenrrfhsvinrxvkyn.supabase.co','sb_publishable_q6wPihobxYCyZB-VCCaIJA_kClDgGqG');let current=null;const $=id=>document.getElementById(id);async function admin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('profiles').select('role').eq('id',user.id).single();return !error&&data?.role==='admin'}async function load(){if(!(await admin())){$('gate').innerHTML='⛔ Acesso restrito. Entre como administrador.';return}$('gate').style.display='none';$('app').style.display='block';const {data,error}=await db.from('lessons').select('id,lesson_number,title,objectives,content,video_url,duration_minutes,is_published').eq('course_id','5a65f12b-e5fc-4b5c-b6d1-0b4d6b1ed1d8').order('lesson_number');if(error){$('summary').textContent=error.message;return}$('summary').textContent=`${data.length} aulas cadastradas`;$('lessons').innerHTML=data.map(l=>`<div class="lesson"><div class="num">Aula ${l.lesson_number}</div><h3>${l.title}</h3><p class="muted">${l.duration_minutes||0} min · ${l.is_published?'✅ Publicada':'🔒 Rascunho'}</p><button onclick='edit(${JSON.stringify(l).replace(/'/g,"&#39;")})'>Editar aula</button></div>`).join('')}function edit(l){current=l;$('mTitle').textContent='Editar Aula '+l.lesson_number;$('title').value=l.title||'';$('objectives').value=l.objectives||'';$('content').value=typeof l.content==='string'?l.content:JSON.stringify(l.content||{},null,2);$('video').value=l.video_url||'';$('duration').value=l.duration_minutes||0;$('published').checked=!!l.is_published;$('saveMsg').textContent='';$('modal').style.display='block'}function closeModal(){$('modal').style.display='none'}$('save').onclick=async()=>{let raw=$('content').value, parsed;try{parsed=JSON.parse(raw)}catch{parsed={text:raw}}const {error}=await db.from('lessons').update({title:$('title').value,objectives:$('objectives').value,content:parsed,video_url:$('video').value||null,duration_minutes:Number($('duration').value)||0,is_published:$('published').checked,updated_at:new Date().toISOString()}).eq('id',current.id);$('saveMsg').textContent=error?error.message:'✅ Aula salva com sucesso.';if(!error){setTimeout(()=>{closeModal();load()},500)}};load()</script></body></html>
