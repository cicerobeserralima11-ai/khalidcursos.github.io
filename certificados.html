<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khalid — Meus Certificados</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:#101828;color:#fff;padding:22px}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 20px #0001;margin-bottom:18px}.cert{border:3px solid #172033;padding:28px;text-align:center;border-radius:12px}.code{font-family:monospace;font-size:18px}.btn{padding:10px 16px;border:0;border-radius:9px;background:#155eef;color:#fff;cursor:pointer}.muted{color:#667085}</style></head><body><header class="top"><strong>🌐 SITE KHALID</strong><div>🏆 Meus Certificados</div></header><main class="wrap"><div class="card"><h1>🏆 Certificados</h1><p class="muted">Certificados emitidos para sua conta.</p><div id="out">Carregando...</div></div></main><script>const db=window.supabase.createClient('https://xraqenrrfhsvinrxvkyn.supabase.co','sb_publishable_q6wPihobxYCyZB-VCCaIJA_kClDgGqG');async function run(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='index.html';return}const {data,error}=await db.from('certificates').select('certificate_code,issued_at,final_score,course_id').eq('user_id',user.id).order('issued_at',{ascending:false});if(error){out.textContent=error.message;return}if(!data?.length){out.innerHTML='<p>Nenhum certificado emitido ainda. Conclua o curso e seja aprovado na prova final.</p>';return}out.innerHTML=data.map(c=>`<div class="cert"><h2>CERTIFICADO DE CONCLUSÃO</h2><p>Este certificado reconhece a conclusão do treinamento profissional.</p><h3>Curso: ${c.course_id}</h3><p>Emitido em ${new Date(c.issued_at).toLocaleDateString('pt-BR')}</p><p>Nota final: ${c.final_score??'—'}</p><p class="code">Código: ${c.certificate_code}</p><button class="btn" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button></div>`).join('<br>')}run()</script></body></html>
