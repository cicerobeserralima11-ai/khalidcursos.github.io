<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khalid — Acompanhamento de Alunos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#101828;color:#fff;padding:22px}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0001;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{padding:18px;border-radius:14px;background:#fff;box-shadow:0 5px 20px #0001}.num{font-size:30px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}.bar{height:9px;background:#e4e7ec;border-radius:20px;overflow:hidden}.fill{height:100%;background:#155eef}button{padding:10px 14px;border:0;border-radius:9px;background:#155eef;color:#fff;cursor:pointer}.muted{color:#667085}.hidden{display:none}</style></head><body><header class="top"><strong>🌐 SITE KHALID</strong><div>👥 Acompanhamento de Alunos</div></header><main class="wrap"><div id="msg" class="card">Verificando acesso...</div><section id="app" class="hidden"><div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="muted">Alunos</div></div><div class="stat"><div class="num" id="enrolled">0</div><div class="muted">Matrículas</div></div><div class="stat"><div class="num" id="progress">0%</div><div class="muted">Progresso médio</div></div><div class="stat"><div class="num" id="approved">0</div><div class="muted">Aprovados</div></div></div><br><div class="card"><h2>📊 Progresso dos alunos</h2><table><thead><tr><th>Aluno</th><th>Curso</th><th>Progresso</th><th>Nota</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const db=window.supabase.createClient('https://xraqenrrfhsvinrxvkyn.supabase.co','sb_publishable_q6wPihobxYCyZB-VCCaIJA_kClDgGqG');const $=id=>document.getElementById(id);async function isAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('sk_profiles').select('role,active').eq('id',user.id).single();return !error&&data?.role==='admin'&&data?.active===true}async function load(){if(!(await isAdmin())){ $('msg').textContent='⛔ Acesso restrito. Faça login como administrador.';return}$('msg').classList.add('hidden');$('app').classList.remove('hidden');const p=await db.from('sk_profiles').select('id,full_name,role').eq('role','aluno');const e=await db.from('sk_enrollments').select('user_id,course_id,progress_percent,final_score,status');$('total').textContent=p.data?.length||0;$('enrolled').textContent=e.data?.length||0;const vals=(e.data||[]).map(x=>Number(x.progress_percent)||0);$('progress').textContent=(vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0)+'%';$('approved').textContent=(e.data||[]).filter(x=>x.status==='approved').length;const names=Object.fromEntries((p.data||[]).map(x=>[x.id,x.full_name||'Sem nome']));const rows=e.data||[];$('rows').innerHTML=rows.map(x=>`<tr><td>${names[x.user_id]||x.user_id}</td><td>${x.course_id}</td><td><div>${Number(x.progress_percent)||0}%</div><div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(0,Number(x.progress_percent)||0))}%"></div></div></td><td>${x.final_score??'—'}</td><td>${x.status||'Em andamento'}</td></tr>`).join('')||'<tr><td colspan="5">Nenhuma matrícula encontrada.</td></tr>')}load()</script></body></html>
