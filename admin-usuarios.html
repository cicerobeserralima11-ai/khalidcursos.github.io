<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khalid — Gestão de Usuários</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.top{background:#101828;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0001;margin-bottom:18px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}select,button{padding:9px;border-radius:8px}button{background:#155eef;color:#fff;border:0}</style><header class="top"><h1>👥 Gestão de Usuários</h1><div>Site Khalid — Administração</div></header><main class="wrap"><div class="card"><h2>Usuários cadastrados</h2><p>O administrador pode visualizar perfis ativos e acompanhar funções.</p><div id="status">Carregando...</div></div><div class="card"><h2>Perfis</h2><table><thead><tr><th>Nome</th><th>Função</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://xraqenrrfhsvinrxvkyn.supabase.co','sb_publishable_q6wPihobxYCyZB-VCCaIJA_kClDgGqG');async function run(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin.html';return}const {data,error}=await db.from('sk_profiles').select('id,full_name,role,active,created_at').order('created_at',{ascending:false});if(error){document.getElementById('status').textContent=error.message;return}document.getElementById('status').textContent=`${data.length} perfil(is) encontrado(s)`;document.getElementById('rows').innerHTML=data.map(u=>`<tr><td>${u.full_name||'Sem nome'}</td><td>${u.role}</td><td>${u.active?'Ativo':'Inativo'}</td></tr>`).join('')}run()</script></html>
